<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#25003a">
<meta name="robots" content="noindex">
<title>Magic Moments — Administration</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="login-card">
    <div class="brand"><span>✦</span> Magic Moments</div>
    <h1>Administration</h1>
    <label>Courriel<input name="email" type="email" required autocomplete="email"></label>
    <label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary full">Se connecter</button>
    <p class="muted"><a href="/">← Retour au site</a></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="brand"><span>✦</span><div>Magic Moments<small>Administration</small></div></div>
    <nav id="sideNav"></nav>
    <div class="side-foot">
      <a class="btn ghost full" href="/" target="_blank" rel="noopener">Voir le site ↗</a>
      <button class="btn ghost full" id="logout" type="button">Déconnexion</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <h1 id="viewTitle">Tableau de bord</h1>
      <div id="topActions" class="top-actions"></div>
    </header>
    <div id="tabs" class="tabs"></div>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card"><button type="button" class="modal-close" id="modalClose" aria-label="Fermer">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="/admin.js"></script>
</body>
</html>
